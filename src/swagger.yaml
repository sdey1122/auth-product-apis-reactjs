openapi: 3.0.3

info:
  title: Role Based Authentication System API
  version: 1.0.0
  description: API documentation for authentication, user, category and product management

servers:
  - url: http://localhost:6899/api

tags:
  - name: Authentication
    description: Authentication and email verification APIs
  - name: Users
    description: Admin user management APIs
  - name: Categories
    description: Public and admin category APIs
  - name: Products
    description: Public and admin product APIs

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          example: 68c123456789abcdef123456
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        role:
          type: string
          enum:
            - user
            - admin
          example: user
        isVerified:
          type: boolean
          example: true
        isActive:
          type: boolean
          example: true

    CategoryImage:
      type: object
      properties:
        url:
          type: string
          example: https://res.cloudinary.com/example/image/upload/category.jpg
        publicId:
          type: string
          example: categories/category123

    Category:
      type: object
      properties:
        _id:
          type: string
          example: 68c123456789abcdef123456
        name:
          type: string
          example: Electronics
        description:
          type: string
          example: Electronic products
        image:
          $ref: "#/components/schemas/CategoryImage"
        isPublished:
          type: boolean
          example: true

    ProductImage:
      type: object
      properties:
        url:
          type: string
          example: https://res.cloudinary.com/example/image/upload/product.jpg
        publicId:
          type: string
          example: products/product123

    ProductCategory:
      type: object
      properties:
        _id:
          type: string
          example: 68c123456789abcdef123456
        name:
          type: string
          example: Electronics

    Product:
      type: object
      properties:
        _id:
          type: string
          example: 68c123456789abcdef123456
        title:
          type: string
          example: Wireless Headphones
        slug:
          type: string
          example: wireless-headphones
        description:
          type: string
          example: Premium wireless headphones
        price:
          type: number
          example: 2499
        category:
          $ref: "#/components/schemas/ProductCategory"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        isPublished:
          type: boolean
          example: true

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - confirmPassword
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  example: "123456"
                confirmPassword:
                  type: string
                  example: "123456"
      responses:
        "201":
          description: Registration successful
        "400":
          description: Validation error
        "409":
          description: Email already registered
        "500":
          description: Unable to send verification email

  /auth/verify-email/{token}:
    get:
      tags:
        - Authentication
      summary: Verify user email
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified successfully
        "400":
          description: Invalid or expired verification token
        "500":
          description: Internal server error

  /auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
      responses:
        "200":
          description: Verification email sent successfully
        "400":
          description: Invalid request
        "404":
          description: User not found
        "500":
          description: Unable to send verification email

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  user:
                    $ref: "#/components/schemas/User"
                  access_token:
                    type: string
                    description: JWT access token valid for 15 minutes
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Missing email or password
        "401":
          description: Invalid email or password
        "403":
          description: Email verification or account status error
        "500":
          description: Internal server error

  /auth/login-with-refresh:
    post:
      tags:
        - Authentication
      summary: Login with access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Login successful with access and refresh tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  user:
                    $ref: "#/components/schemas/User"
                  access_token:
                    type: string
                    description: JWT access token valid for 15 minutes
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refresh_token:
                    type: string
                    description: JWT refresh token valid for 7 days
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Missing email or password
        "401":
          description: Invalid email or password
        "403":
          description: Email verification or account status error
        "500":
          description: Internal server error

  /auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: JWT refresh token
                  example: eyJhbGciOiJIUzI1NiIs...
      responses:
        "200":
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Access token refreshed successfully
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIs...
        "401":
          description: Invalid or expired refresh token
        "403":
          description: Account deactivated
        "500":
          description: Internal server error

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Enter the access token manually using the X-Access-Token header.
      parameters:
        - name: X-Access-Token
          in: header
          required: true
          description: Enter your access token without the Bearer prefix.
          schema:
            type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logout successful
        "401":
          description: Authentication required
        "500":
          description: Internal server error

  /admin/users:
    get:
      tags:
        - Users
      summary: Get all users
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
          example: 10
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum:
              - user
              - admin
          example: user
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
          example: true
      responses:
        "200":
          description: Users retrieved successfully
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

  /admin/user/{id}:
    patch:
      tags:
        - Users
      summary: Edit user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Updated
                email:
                  type: string
                  format: email
                  example: updated@example.com
      responses:
        "200":
          description: User updated successfully
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: User not found

    delete:
      tags:
        - Users
      summary: Delete user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deleted successfully
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: User not found

  /admin/user/{userId}/{role}/change:
    patch:
      tags:
        - Users
      summary: Change user role
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum:
              - user
              - admin
      responses:
        "200":
          description: User role changed successfully
        "400":
          description: Invalid role
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: User not found

  /admin/user/{id}/activation:
    patch:
      tags:
        - Users
      summary: Change user activation status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User activation status changed successfully
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: User not found

  /categories:
    get:
      tags:
        - Categories
      summary: Get published categories
      responses:
        "200":
          description: Published categories retrieved successfully

  /category/{id}:
    get:
      tags:
        - Categories
      summary: Get category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category retrieved successfully
        "404":
          description: Category not found

  /admin/categories:
    get:
      tags:
        - Categories
      summary: Get all categories
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Categories retrieved successfully
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

  /admin/category:
    post:
      tags:
        - Categories
      summary: Create category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - description
                - image
              properties:
                name:
                  type: string
                  example: Electronics
                description:
                  type: string
                  example: Electronic products
                isPublished:
                  type: boolean
                  example: true
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Category created successfully
        "400":
          description: Invalid category data
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

  /admin/category/{id}:
    patch:
      tags:
        - Categories
      summary: Update category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Electronics
                description:
                  type: string
                  example: Electronic products
                isPublished:
                  type: boolean
                  example: true
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Category updated successfully
        "400":
          description: Invalid category data
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: Category not found

    delete:
      tags:
        - Categories
      summary: Delete category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category deleted successfully
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: Category not found

  /admin/category/{id}/publish:
    patch:
      tags:
        - Categories
      summary: Toggle category publish status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category publish status changed successfully
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: Category not found

  /products:
    get:
      tags:
        - Products
      summary: Get published products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          example: Electronics
        - name: search
          in: query
          required: false
          schema:
            type: string
          example: headphones
        - name: minprice
          in: query
          required: false
          schema:
            type: number
          example: 1000
        - name: maxprice
          in: query
          required: false
          schema:
            type: number
          example: 5000
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          example: 10
      responses:
        "200":
          description: Published products retrieved successfully

  /products/{slug}:
    get:
      tags:
        - Products
      summary: Get published product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: wireless-headphones
      responses:
        "200":
          description: Product retrieved successfully
        "404":
          description: Product not found

  /admin/products:
    get:
      tags:
        - Products
      summary: Get all products
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          example: Electronics
        - name: search
          in: query
          required: false
          schema:
            type: string
          example: headphones
        - name: isPublished
          in: query
          required: false
          schema:
            type: boolean
          example: true
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          example: 10
      responses:
        "200":
          description: Products retrieved successfully
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

    post:
      tags:
        - Products
      summary: Create product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - price
                - category
                - images
              properties:
                title:
                  type: string
                  example: Wireless Headphones
                description:
                  type: string
                  example: Premium wireless headphones
                price:
                  type: number
                  example: 2499
                category:
                  type: string
                  example: 68c123456789abcdef123456
                isPublished:
                  type: boolean
                  example: true
                images:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Product created successfully
        "400":
          description: Invalid product data
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

  /admin/product/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product retrieved successfully
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: Product not found

    patch:
      tags:
        - Products
      summary: Update product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Wireless Headphones Pro
                description:
                  type: string
                  example: Premium wireless headphones
                price:
                  type: number
                  example: 2999
                category:
                  type: string
                  example: 68c123456789abcdef123456
                isPublished:
                  type: boolean
                  example: true
                images:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Product updated successfully
        "400":
          description: Invalid product data
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: Product not found

    delete:
      tags:
        - Products
      summary: Delete product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product deleted successfully
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: Product not found

  /admin/product/{id}/publish:
    patch:
      tags:
        - Products
      summary: Toggle product publish status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product publish status changed successfully
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: Product not found
